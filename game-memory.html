<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gate 2 — Memory</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav id="flags"></nav>

<main class="wrap">
  <p class="eyebrow"></p>
  <h1 style="font-size:34px">Find the pairs.</h1>
  <p class="hint">Six pairs. Your memory is famously excellent.</p>

  <div class="memory-grid" id="grid"></div>
  <p class="hint" id="status" style="margin-top:22px">0 of 6 pairs</p>

  <div class="card" id="cleared" hidden>
    <p class="cleared-text"></p>
    <a class="btn" href="#">Next gate</a>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
Prog.guard();
start();

const FACES = ["\u{1F382}", "\u{1F388}", "\u{1F381}", "\u{1F370}", "\u{1F389}", "\u2B50"];
const PAIRS = FACES.length;

// Fisher-Yates, so the layout is different every time she comes back.
const deck = FACES.concat(FACES);
for (let i = deck.length - 1; i > 0; i--) {
  const j = (Math.random() * (i + 1)) | 0;
  [deck[i], deck[j]] = [deck[j], deck[i]];
}

const grid = document.getElementById("grid");
const status = document.getElementById("status");

let first = null, busy = false, misses = 0, found = 0, over = false;

// The two points where the game quietly stops being a game.
const sticky = () => misses >= 3;   // wrong pairs no longer hide again
const gifted = () => misses >= 5;   // touching a card reveals its partner too

const tiles = deck.map((face, i) => {
  const b = document.createElement("button");
  b.className = "card-tile";
  b.innerHTML = `<span class="face">${face}</span>`;
  b.setAttribute("aria-label", "Card " + (i + 1));
  b.onclick = () => tap(i);
  grid.appendChild(b);
  return b;
});

const show = i => { tiles[i].classList.add("up"); };
const hide = i => { if (tiles[i].dataset.done !== "1") tiles[i].classList.remove("up"); };

function lockPair(a, b) {
  [a, b].forEach(i => {
    tiles[i].dataset.done = "1";
    tiles[i].classList.add("up", "done");
    tiles[i].disabled = true;
  });
  found++;
  paint();
  if (found === PAIRS) win("Six pairs. Nobody doubted you.");
}

function tap(i) {
  if (over || busy) return;
  if (tiles[i].dataset.done === "1") return;
  if (first === i) return;

  show(i);

  // Past a certain amount of flailing, the cards just help.
  if (gifted()) {
    const partner = deck.findIndex((f, k) => f === deck[i] && k !== i && tiles[k].dataset.done !== "1");
    if (partner > -1) {
      show(partner);
      if (first !== null && first !== i && first !== partner) hide(first);
      first = null;
      lockPair(i, partner);
    }
    return;
  }

  if (first === null) { first = i; return; }

  const a = first;
  first = null;

  if (deck[a] === deck[i]) { lockPair(a, i); return; }

  misses++;
  paint();

  if (sticky()) return;   // leave them face up; she has suffered enough

  busy = true;
  setTimeout(() => { hide(a); hide(i); busy = false; }, 900);
}

const TAUNTS = [
  "Close.",
  "That was the same card twice, nearly.",
  "Fine \u2014 they'll stay face up now.",
  "Still face up. Take your time.",
  "New rule: touching a card finds its twin."
];

function paint() {
  status.textContent = found + " of " + PAIRS + " pairs"
    + (misses && !over ? " \u2014 " + TAUNTS[Math.min(misses, TAUNTS.length) - 1] : "");
}

function win(message) {
  over = true;
  stopMercy();
  tiles.forEach(t => { t.disabled = true; t.classList.add("up"); });
  status.textContent = PAIRS + " of " + PAIRS + " pairs";
  clearGate(message);
}

// If she just sits and looks at it, the gate opens anyway.
const stopMercy = mercy(30, () => win("You waited it out. Respectable strategy."));
</script>
</body>
</html>
