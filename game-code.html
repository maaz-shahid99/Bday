<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gate 7 — The lock</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav id="flags"></nav>

<main class="wrap">
  <p class="eyebrow"></p>
  <h1 style="font-size:34px">The last lock.</h1>
  <p class="hint">Four digits. Only you could possibly know it.</p>

  <div class="pin-dots" id="dots" role="status" aria-label="Code entry"></div>
  <div class="keypad" id="pad"></div>
  <p class="hint" id="status" style="margin-top:18px">Enter the code.</p>

  <div class="card" id="cleared" hidden>
    <p class="cleared-text"></p>
    <a class="btn" href="#">Open the wall</a>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
Prog.guard();
start();

// The code is her birthday: day, then month. Nothing new to configure.
function codeFrom(iso) {
  const d = new Date(iso);
  if (isNaN(d.getTime())) return null;
  return String(d.getDate()).padStart(2, "0") + String(d.getMonth() + 1).padStart(2, "0");
}
const CODE = codeFrom(CONFIG.birthday);
const LOCK = CODE || "0000";

const dots = document.getElementById("dots");
const pad = document.getElementById("pad");
const status = document.getElementById("status");

let entry = "", tries = 0, over = false;

/* --- the hints give up faster than she will --- */
const HINTS = [
  CODE ? "It's a date." : "The birthday in the config is unreadable, so it's 0000.",
  "A date you know well.",
  "It's your date.",
  "Day, then month.",
  "It's " + LOCK + ". Openly. In writing."
];

for (const key of ["1","2","3","4","5","6","7","8","9","clear","0","del"]) {
  const b = document.createElement("button");
  b.className = "key" + (key === "clear" || key === "del" ? " key-alt" : "");
  b.textContent = key === "del" ? "\u232B" : key === "clear" ? "\u21BA" : key;
  b.setAttribute("aria-label",
    key === "del" ? "Delete" : key === "clear" ? "Clear" : "Digit " + key);
  b.onclick = () => press(key);
  pad.appendChild(b);
}

addEventListener("keydown", e => {
  if (/^[0-9]$/.test(e.key)) press(e.key);
  else if (e.key === "Backspace") { press("del"); e.preventDefault(); }
  else if (e.key === "Escape") press("clear");
});

function press(key) {
  if (over) return;
  if (key === "del") entry = entry.slice(0, -1);
  else if (key === "clear") entry = "";
  else if (entry.length < 4) entry += key;

  paint();
  if (entry.length === 4) setTimeout(check, 220);
}

function check() {
  // After five wrong tries the lock stops caring what you typed.
  if (entry === LOCK || tries >= HINTS.length) {
    return win(entry === LOCK
      ? "Open. It was your own birthday."
      : "The lock gave up before you did.");
  }

  status.textContent = HINTS[tries];
  tries++;
  guide.bump();                       // she is still trying; no need to step in
  entry = "";
  dots.classList.add("wrong");
  setTimeout(() => { dots.classList.remove("wrong"); paint(); }, 420);
}

function paint() {
  dots.innerHTML = Array.from({ length: 4 }, (_, i) =>
    `<span class="dot${i < entry.length ? " filled" : ""}"></span>`).join("");
}

function win(message) {
  if (over) return;
  over = true;
  guide.stop();
  entry = LOCK;
  paint();
  status.textContent = "Unlocked.";
  pad.querySelectorAll("button").forEach(b => b.disabled = true);
  clearGate(message);
}

paint();

const guide = mercy(45, () => win("The lock let you in out of pity."));
</script>
</body>
</html>
