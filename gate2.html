<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gate 2 — Balloons</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav id="flags"></nav>

<main class="wrap">
  <p class="eyebrow"></p>
  <h1 style="font-size:34px">Pop them all.</h1>
  <p class="hint">Each one is hiding a letter.</p>

  <div class="sky" id="sky"></div>
  <p class="spelled" id="spelled"></p>
  <p class="hint" id="taunt"></p>

  <div class="card" id="cleared" hidden>
    <p class="cleared-text"></p>
    <a class="btn" href="#">Next gate</a>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
Prog.guard();
start();

const LETTERS = CONFIG.name.toUpperCase().replace(/[^A-Z]/g, "").split("");
const COLORS = ["#FF5FA2", "#FFD93D", "#6FE3C1", "#7B5BFF", "#2B1B44"];
const sky = document.getElementById("sky");
const out = document.getElementById("spelled");
const taunt = document.getElementById("taunt");

// One balloon refuses to be caught — until it doesn't.
// The sky grows with the name - four balloons to a row - so a long name
// still lands inside it instead of spilling past the bottom.
const COLS = 4, ROW = 108, BW = 52, BH = 64;
const rows = Math.ceil(LETTERS.length / COLS);
const skyH = rows * ROW + 24;
sky.style.height = skyH + "px";

// fx is a fraction of the room actually left over once the balloon's own
// width is taken off, so it can never hang off the right edge.
function put(b, fx, top) {
  const f = Math.max(0, Math.min(1, fx));
  b.style.left = "calc((100% - " + BW + "px) * " + f.toFixed(3) + ")";
  b.style.top = Math.max(0, Math.min(skyH - BH, top)) + "px";
}

const RUNNER = Math.floor(Math.random() * LETTERS.length);
let dodges = 0, popped = 0;
const found = LETTERS.map(() => "_");

LETTERS.forEach((letter, i) => {
  const b = document.createElement("button");
  b.className = "balloon";
  b.textContent = letter;
  b.style.background = COLORS[i % COLORS.length];
  b.style.color = COLORS[i % COLORS.length] === "#FFD93D" ? "#2B1B44" : "#fff";
  place(b, i);
  b.onclick = () => (i === RUNNER && dodges < 8) ? dodge(b) : pop(b, i);
  sky.appendChild(b);
});

function place(b, i) {
  const col = i % COLS, row = Math.floor(i / COLS);
  // A short last row gets spread across the full width rather than bunched
  // at the left - SHARMITHA leaves one balloon on its own.
  const inRow = Math.min(COLS, LETTERS.length - row * COLS);
  put(b, (col + 0.5) / inRow - 0.04 + Math.random() * 0.08,
         row * ROW + 8 + Math.random() * 12);
}

function dodge(b) {
  dodges++;
  put(b, Math.random(), Math.random() * (skyH - BH));
  taunt.textContent = dodges < 8
    ? ["Missed.", "Not even close.", "It saw that coming.", "Try harder."][dodges % 4]
    : "Fine. It's tired. Tap it.";
}

function pop(b, i) {
  if (b.classList.contains("gone")) return;
  b.classList.add("gone");
  found[i] = LETTERS[i];
  out.textContent = found.join(" ");
  if (++popped === LETTERS.length) {
    taunt.textContent = "";
    clearGate("That is your name. We checked.");
  }
}

out.textContent = found.join(" ");
</script>
</body>
</html>
