<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gate 1 — Candles</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,600&family=Outfit:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<nav id="flags"></nav>

<main class="wrap">
  <p class="eyebrow"></p>
  <h1 style="font-size:34px">Blow them out.</h1>
  <p class="hint">Tap each flame. Good luck.</p>

  <div class="cake" id="cake"></div>
  <p class="hint" id="status" style="margin-top:26px">0 of 5 out</p>

  <div class="card" id="cleared" hidden>
    <p class="cleared-text"></p>
    <a class="btn" href="#">Next gate</a>
  </div>
</main>

<script src="assets/app.js"></script>
<script>
Prog.guard();
start();

// How many times each candle stubbornly relights itself.
const RELIGHTS = [0, 1, 0, 1, 3];
const cake = document.getElementById("cake");
const status = document.getElementById("status");
const left = RELIGHTS.slice();

RELIGHTS.forEach((_, i) => {
  const c = document.createElement("button");
  c.className = "candle";
  c.style.left = (21 + i * 42) + "px";   // 42px apart so the tap areas never overlap
  c.setAttribute("aria-label", "Candle " + (i + 1));
  c.onclick = () => blow(i, c);
  cake.appendChild(c);
});

function blow(i, el) {
  if (el.classList.contains("out")) return;
  el.classList.add("out");
  count();

  if (left[i] > 0) {
    left[i]--;
    setTimeout(() => {
      el.classList.remove("out");
      el.classList.add("relit");
      setTimeout(() => el.classList.remove("relit"), 400);
      count();
    }, 900 + Math.random() * 700);
  }
}

function count() {
  const out = cake.querySelectorAll(".candle.out").length;
  const total = RELIGHTS.length;
  status.textContent = out + " of " + total + " out"
    + (out < total && left[4] === 0 ? " — the last one is just tired now" : "");
  if (out === total) {
    clearGate("All out. That took longer than it should have.");
    cake.querySelectorAll(".candle").forEach(c => c.disabled = true);
  }
}
</script>
</body>
</html>
